name: cricket_game
description: "A 2D Flutter Flame cricket game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.35.1
  flame_audio: ^2.10.4
  audioplayers: ^6.6.0
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_test: ^1.18.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

# Splash screen — generated by `dart run flutter_native_splash:create`.
# Colors mirror lib/utils/theme.dart (menuBackdrop palette).
# Add `image:` later when a logo PNG is available.
flutter_native_splash:
  color: "#0E3520"          # mid stadium green
  color_dark: "#051F12"     # deep stadium green
  android_12:
    color: "#0E3520"
    color_dark: "#051F12"
  android: true
  ios: true
  web: false
